<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyCockpit Backup Downloader</title>
    <!-- Das Manifest bindet die PWA ein -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
        }
        header {
            position: sticky;
            margin: 0;
            z-index: 1;
            top: 0;
            background-color: #333;
            box-shadow: 0 -1px 0 0 #333;
            color: #fff;
        }
        header h2 {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            font-weight: lighter;
            background-image: url("./disk.png");
            background-repeat: no-repeat;
            background-size: 40px;
            background-position: 20px center;
            text-indent: 50px;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom: 10px;
        }
        h2 + h2 {
            margin-top: 40px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0 25px 0;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #renderBtn {
            background-color: #2e9b49;
            color: white;
            flex: 2;
        }
        #renderBtn:hover {
            background-color: #1d8837;
        }
        #resetBtn {
            background-color: #e3e3e8;
            color: #333;
        }
        #resetBtn:hover {
            background-color: #d1d1d6;
        }
        .output-container {
            overflow: hidden;
        }
        iframe {
            width: 200%;
            height: 400px;
            border: none;
            display: block;
            scale: .5;
            margin-top: -40%;
            margin-left: -50%;
        }
        .error {
            color: #f28800;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }
        /* Status-Anzeige für den Empfang über das Teilen-Menü */
        .share-status {
            color: #0071e3;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h2>AnyCockpit Backup Downloader</h2>
    </header>

    <main>
        <h2>Export String</h2>
        <p style="font-size: 14px; color: #666;">
            Possible Export Types: HTML File, SVG File and JSON File
        </p>
        
        <!-- Status-Text für eingehende Shares -->
        <div id="shareStatus" class="share-status"></div>

        <textarea id="rawInput" placeholder="data:text/html;utf8,..."></textarea>
        
        <div class="button-group">
            <button id="renderBtn">Generate Download Link</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div id="errorMsg" class="error"></div>

        <div id="previewArea" style="display: none;">
            <div class="output-container">
                <iframe id="previewFrame" src="about:blank"></iframe>
            </div>
        </div>
    </main>

    <script>
        // -------------------------------------------------------------
        // PWA REGISTRIERUNG & SHARE TARGET LOGIK (NEU)
        // -------------------------------------------------------------
        
        // Service Worker für GitHub Pages relativ registrieren
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registriert'))
                .catch(err => console.error('SW Registrierung fehlgeschlagen', err));
        }

        // Hilfsfunktion zum Auslesen aus der IndexedDB
        function getFromIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SharedDataDB', 1);
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('shared_strings')) {
                        return resolve(null);
                    }
                    const transaction = db.transaction('shared_strings', 'readonly');
                    const store = transaction.objectStore('shared_strings');
                    const getRequest = store.get('latest');

                    getRequest.onsuccess = () => resolve(getRequest.result ? getRequest.result.text : null);
                    getRequest.onerror = () => reject(getRequest.onerror);
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Prüfen, ob Daten über das native Teilen-Feature reinkamen
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shareStatus = document.getElementById('shareStatus');
            
            if (urlParams.has('shared')) {
                shareStatus.innerText = 'Extracting shared data...';
                
                try {
                    const largeString = await getFromIndexedDB();
                    if (largeString) {
                        // Den empfangenen String in das Textfeld einsetzen
                        rawInput.value = largeString;
                        shareStatus.innerText = '✓ Data successfully received via share!';
                        
                        // Bereinigung der URL-Zeile ohne Neuladen (behält GitHub Pages Pfad bei)
                        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);

                        // Automatisch den Render-Prozess anstoßen
                        document.getElementById('renderBtn').click();
                    } else {
                        shareStatus.innerText = 'No shared data found in storage.';
                    }
                } catch (e) {
                    shareStatus.innerText = 'Error loading shared data.';
                    console.error(e);
                }
            }
        });

        // -------------------------------------------------------------
        // DEINE BESTEHENDE LOGIK (UNVERÄNDERT)
        // -------------------------------------------------------------
        
        // Global variable to track and release the memory allocated for the Blob URL
        let currentBlobUrl = null;

        const rawInput = document.getElementById('rawInput');
        const iframe = document.getElementById('previewFrame');
        const errorMsg = document.getElementById('errorMsg');
        const previewArea = document.getElementById('previewArea');

        // EVENT LISTENER: RENDER BUTTON
        document.getElementById('renderBtn').addEventListener('click', function() {
            const input = rawInput.value.trim();
            
            // Reset error messages and hidden state
            errorMsg.style.display = 'none';
            errorMsg.innerText = '';
            previewArea.style.display = 'none';

            const renderInvalidInputError = () => {
                showError('Please enter a valid AnyCockpit Export String.');
            };

            if (!input) {
                renderInvalidInputError();
                return;
            }



            try {
                let htmlContent = '';

                // Check if the input starts with a standard Data-URI header
                if (input.startsWith('data:text/html')) {
                    
                    if (input.includes(';base64,')) {
                        // Case 1: The content is Base64 encoded
                        const base64Part = input.split(';base64,')[1];
                        // atob decodes Base64 to binary string; decodeURIComponent(escape()) safely handles UTF-8 characters like German umlauts
                        htmlContent = decodeURIComponent(escape(atob(base64Part)));
                    } else if (input.includes(';utf8,') || input.includes(',')) {
                        // Case 2: The content is plain text (UTF-8) with URL encoding
                        const textPart = input.substring(input.indexOf(',') + 1);
                        htmlContent = decodeURIComponent(textPart);
                    } else {
                        renderInvalidInputError();
                        return;
                    }
                    
                } else {
                    // Fallback: If pure Base64 without headers was entered
                    if (input.startsWith('PG') || input.startsWith('PC')) { 
                        // String patterns look like pure Base64 encoding
                        htmlContent = decodeURIComponent(escape(atob(input)));
                    } else {
                        renderInvalidInputError();
                        return;
                    }
                }

                // Release previous Blob memory block before generating a new one
                clearBlob();

                // Create a new Blob out of the HTML string specifying the correct MIME-type and encoding
                const blob = new Blob([htmlContent], { type: 'text/html; charset=utf-8' });
                
                // Generate a short, temporary Blob URL acting as a memory pointer
                currentBlobUrl = URL.createObjectURL(blob);

                // Point the iframe source to the short Blob URL to safely fetch content directly from the RAM
                iframe.src = currentBlobUrl;

                // Make the entire preview section visible now that content is successfully ready to display
                previewArea.style.display = 'block';

            } catch (e) {
                showError('Decoding error: Please check your Base64 string format. (' + e.message + ')');
                iframe.src = 'about:blank';
                previewArea.style.display = 'none';
            }
        });

        // EVENT LISTENER: RESET BUTTON
        document.getElementById('resetBtn').addEventListener('click', function() {
            // Clear textarea value
            rawInput.value = '';
            
            // Hide and wipe error messages
            errorMsg.style.display = 'none';
            errorMsg.innerText = '';
            
            // Reset iframe view back to blank page
            iframe.src = 'about:blank';
            previewArea.style.display = 'none';
            
            // Free allocated RAM immediately by removing the active Blob reference
            clearBlob();
        });

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }

        function clearBlob() {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
        }
    </script>
</body>
</html>
